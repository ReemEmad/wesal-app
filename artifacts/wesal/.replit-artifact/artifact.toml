kind = "mobile"
previewPath = "/"
title = "Wesal"
description = "Native Wesal mobile app imported from ReemEmad/wesal-app, preserving Expo, TypeScript and React Navigation. First onboarding implementation will use the supplied Arabic design reference and complete token export."
version = "1.0.0"
id = "artifacts/wesal"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24348

[services.development]
run = "pnpm --filter @workspace/wesal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wesal", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/wesal", "run", "serve" ]

[services.env]
PORT = "24348"
BASE_PATH = "/"
